apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-ingress
  namespace: argocd
spec:
  project: default
  sources:
    #Source 1: TRAEFIK HELM CHART
    - chart: traefik 
      repoURL: https://helm.traefik.io/traefik
      targetRevision: "*"
      helm:
        valueFiles:
          - $values/charts/traefik/values.yaml

    - repoURL: https://github.com/Joshy0u/k8s-infrastructure.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true #fights drift
    syncOptions:
      - CreateNamespace=true
