apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
spec:
  project: default
  source:
    repoURL: https://github.com/Joshy0u/k8s-infrastructure
    path: manifests/frontend
  destination:
    server: https://kubernetes.default.svc 
    namespace: dbproject
  syncPolicy:
    automated:
      prune: false 
      selfHeal: false 
